name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Serialize, но БЕЗ отмены текущего. Раньше cancel-in-progress: true
  # убивал run при следующем push'е, и если series быстрых пушей шли в
  # пределах 1–3 минут (npm ci ещё не завершился), каждый кроме последнего
  # отменялся до pm2 reload — фиксы оставались в репо, на прод не
  # докатывались.
  #
  # С false: GH Actions держит одну активную и одну pending. Третий push
  # вытесняет pending (его коммит уже есть в коде четвёртого, ничего не
  # теряем), но активная всегда докатывается до pm2 reload. Минус —
  # потратим больше CI-минут при пиковой активности; плюс — гарантия,
  # что прод догоняет master.
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    # Красный main не уезжает в прод: те же проверки, что и в CI, до SSH.
    # UI smoke гоняет ci.yml на PR и рабочих ветках — здесь он затянул бы деплой.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Незаданные секреты приходят пустой строкой — upsert_env их
          # пропускает, .env на сервере остаётся как был.
          # Оба имени токена: приложение понимает любое, и деплой тоже —
          # чтобы секрет сработал независимо от того, как его назвали.
          TASKSFLOW_BOT_TOKEN: ${{ secrets.TASKSFLOW_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_MODE: ${{ secrets.TELEGRAM_MODE }}
          TELEGRAM_HTTP_PROXY: ${{ secrets.TELEGRAM_HTTP_PROXY }}
          TELEGRAM_API_BASE_URL: ${{ secrets.TELEGRAM_API_BASE_URL }}
          TELEGRAM_API_IP: ${{ secrets.TELEGRAM_API_IP }}
          # Очередь AI-разбора ProjectsFlow: без неё бот собирает задачи
          # вручную, потому что claude CLI на прод-сервере нет.
          PF_API_URL: ${{ secrets.PF_API_URL }}
          PF_AGENT_TOKEN: ${{ secrets.PF_AGENT_TOKEN }}
          PF_TASKSFLOW_PROJECT_ID: ${{ secrets.PF_TASKSFLOW_PROJECT_ID }}
          # Почта: на проде письма сдаются локальному MTA FastPanel
          # (localhost:25, без логина) — почтовый домен tasksflow.ru с DKIM
          # живёт на том же сервере. SMTP_USER/SMTP_PASS намеренно НЕ
          # прокидываем: с ними server/mail.ts ушёл бы в ветку внешнего
          # SMTP с авторизацией.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # Письма авторизации идут другим путём — server/mailer.ts через
          # PHP mail(). Без MAIL_FROM он слал от noreply@yesbeat.ru, потому
          # что у tasksflow.ru не было SPF/DKIM. Теперь есть.
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Секреты бота — чтобы не ходить на сервер руками ради двух строк
          # в .env. Пустые значения ничего не меняют: .env на сервере
          # остаётся источником правды, как в ProjectsFlow.
          envs: TASKSFLOW_BOT_TOKEN,TELEGRAM_BOT_TOKEN,TELEGRAM_BOT_USERNAME,TELEGRAM_MODE,TELEGRAM_HTTP_PROXY,TELEGRAM_API_BASE_URL,TELEGRAM_API_IP,PF_API_URL,PF_AGENT_TOKEN,PF_TASKSFLOW_PROJECT_ID,SMTP_HOST,SMTP_PORT,SMTP_FROM,MAIL_FROM
          script: |
            set -Eeuo pipefail

            export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ] || [ ! -f "$DEPLOY_PATH/package.json" ]; then
              DEPLOY_PATH="/var/www/tasksflow/data/www/tasksflow.ru"
            fi

            cd "$DEPLOY_PATH"
            [ -f package.json ] || { echo "FATAL: package.json not found in $(pwd)"; exit 1; }

            echo ">>> sync with origin/main (hard reset)"
            # Прод — чистая deploy-копия, ручных правок тут быть не должно.
            # Раньше использовали git pull --ff-only, но npm ci/install
            # иногда трогает package-lock.json, и pull падает с
            # «local changes would be overwritten». Теперь делаем
            # fetch + reset --hard origin/main: гарантированно ровно
            # то, что в репо. Если что-то отброшено — видно в логе.
            git fetch origin main
            # .build-sha пишет сам деплой (см. ниже) — это не ручная правка.
            DIRTY="$(git status --short -- . ':(exclude).build-sha')"
            if [ -n "$DIRTY" ]; then
              echo "WARNING: discarding local changes before reset:"
              echo "$DIRTY"
            fi
            git reset --hard origin/main
            git log --oneline -1

            # Переменные Telegram-бота из GitHub Secrets → .env сервера.
            # Идемпотентно: заданный секрет перезаписывает строку, пустой
            # не трогает ничего. Значения не печатаем — только имена.
            #
            # .env остаётся источником правды (как в ProjectsFlow, где он
            # исключён из синхронизации): секреты лишь позволяют выставить
            # переменную, не заходя на сервер по SSH.
            upsert_env() {
              local key="$1" value="$2"
              [ -n "$value" ] || return 0
              touch .env
              if grep -q "^${key}=" .env; then
                grep -v "^${key}=" .env > .env.tmp && mv .env.tmp .env
              fi
              printf '%s=%s\n' "$key" "$value" >> .env
              chmod 600 .env
              echo ">>> .env: $key обновлён из secrets"
            }
            upsert_env TASKSFLOW_BOT_TOKEN "${TASKSFLOW_BOT_TOKEN:-}"
            upsert_env TELEGRAM_BOT_TOKEN "${TELEGRAM_BOT_TOKEN:-}"
            upsert_env TELEGRAM_BOT_USERNAME "${TELEGRAM_BOT_USERNAME:-}"
            upsert_env TELEGRAM_MODE "${TELEGRAM_MODE:-}"
            upsert_env TELEGRAM_HTTP_PROXY "${TELEGRAM_HTTP_PROXY:-}"
            upsert_env TELEGRAM_API_BASE_URL "${TELEGRAM_API_BASE_URL:-}"
            upsert_env TELEGRAM_API_IP "${TELEGRAM_API_IP:-}"
            upsert_env PF_API_URL "${PF_API_URL:-}"
            upsert_env PF_AGENT_TOKEN "${PF_AGENT_TOKEN:-}"
            upsert_env PF_TASKSFLOW_PROJECT_ID "${PF_TASKSFLOW_PROJECT_ID:-}"
            upsert_env SMTP_HOST "${SMTP_HOST:-}"
            upsert_env SMTP_PORT "${SMTP_PORT:-}"
            upsert_env SMTP_FROM "${SMTP_FROM:-}"
            upsert_env MAIL_FROM "${MAIL_FROM:-}"

            # Явно сообщаем результат: в логе деплоя сразу видно, дошёл
            # токен или секрет так и не создали.
            if grep -qE '^(TASKSFLOW|TELEGRAM)_BOT_TOKEN=.+' .env; then
              echo ">>> токен бота в .env есть"
            else
              echo ">>> ВНИМАНИЕ: токена бота в .env нет — бот не поднимется"
            fi

            DEPS_STAMP=".deploy-deps.sha256"
            DEPS_HASH="$(sha256sum package.json package-lock.json | sha256sum | awk '{print $1}')"
            if [ ! -d node_modules ] || [ ! -f "$DEPS_STAMP" ] || [ "$(cat "$DEPS_STAMP")" != "$DEPS_HASH" ]; then
              echo ">>> dependencies changed: npm ci"
              npm ci --no-audit --fund=false --prefer-offline
              echo "$DEPS_HASH" > "$DEPS_STAMP"
            else
              echo ">>> dependencies unchanged: skip npm ci"
            fi

            echo ">>> mysqldump BEFORE migrations (safety net)"
            # 28.04.2026 prod БД была wipe'нута через ручной drizzle-kit
            # push --force, backup'а не было — потеряли tasks/invitations
            # навсегда. Теперь перед каждым deploy делаем dump в
            # ~/backups/tasksflow-YYYY-MM-DD-HH-mm-ss.sql.gz. Ротация 30
            # дней. Если этот шаг упал — DEPLOY ABORT (а не non-fatal!),
            # потому что без бэкапа продолжать опасно.
            npm run backup-db

            echo ">>> safe migrations"
            npm run create-api-keys-table || echo "api_keys migration failed (non-fatal)"
            npm run create-invitations-table || echo "invitations migration failed (non-fatal)"
            npm run add-claim-col || echo "claim col migration failed (non-fatal)"
            npm run add-managed-workers-col || echo "managed-workers col migration failed (non-fatal)"
            npm run add-position-col || echo "position col migration failed (non-fatal)"
            npm run add-api-key-encrypted || echo "api-key-encrypted migration failed (non-fatal)"
            npm run add-verification-cols || echo "verification-cols migration failed (non-fatal)"
            npm run add-telegram-cols || echo "telegram cols migration failed (non-fatal)"
            npm run add-due-date-col || echo "due-date col migration failed (non-fatal)"
            npm run add-example-photos-col || echo "example-photos col migration failed (non-fatal)"
            npm run create-telegram-tables || echo "telegram tables migration failed (non-fatal)"
            npm run add-tg-link-code-cols || echo "tg-link-code cols migration failed (non-fatal)"
            npm run add-draft-autocreate-col || echo "draft auto-create col migration failed (non-fatal)"
            # Колонки PIN обязательны: без них код не прочитает users и вход
            # сломается. Падение здесь останавливает деплой до сборки — прод
            # остаётся на старом коде.
            npm run add-pin-cols

            echo ">>> build (в dist.next, рабочий dist не трогаем)"
            # Раньше npm run build первым делом удалял dist: на время сборки
            # работающий процесс оставался без статики и шаблона SSR, а упавшая
            # сборка плюс любой рестарт (watchdog, ребут) давали простой. Теперь
            # сборка идёт в соседнюю папку, dist подменяется переименованием
            # только после успеха, а прежняя сборка остаётся для отката.
            NEXT_DIR="$DEPLOY_PATH/dist.next"
            PREV_DIR="$HOME/.tasksflow-deploy/dist.prev"
            rm -rf "$NEXT_DIR"
            if ! BUILD_OUT_DIR="$NEXT_DIR" npm run build; then
              rm -rf "$NEXT_DIR"
              echo "FATAL: сборка упала — прод остаётся на прежней сборке"
              exit 1
            fi

            # /api/health отдаёт содержимое .build-sha — по нему проверяем,
            # что после reload отвечает именно новая сборка.
            NEW_SHA="$(git rev-parse --short=12 HEAD)"
            OLD_SHA="$(cat .build-sha 2>/dev/null || true)"
            mkdir -p "$(dirname "$PREV_DIR")"
            rm -rf "$PREV_DIR"
            if [ -d dist ]; then mv dist "$PREV_DIR"; fi
            mv "$NEXT_DIR" dist
            echo "$NEW_SHA" > .build-sha

            reload_app() {
              if pm2 describe tasksflow > /dev/null 2>&1; then
                pm2 reload tasksflow --update-env || pm2 restart tasksflow --update-env
              else
                pm2 start dist/index.cjs --name tasksflow --cwd "$DEPLOY_PATH"
                pm2 save
              fi
            }

            # Порт как у самого приложения: env процесса PM2 → .env → 5000.
            app_port() {
              local port=""
              # pm2 иногда печатает предупреждение перед JSON — режем до первого «[».
              port="$(pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>{try{const i=s.indexOf("[");const p=JSON.parse(i>=0?s.slice(i):s).find((x)=>x.name==="tasksflow");const e=(p&&p.pm2_env)||{};process.stdout.write(String((e.env&&e.env.PORT)||e.PORT||""))}catch(_){}})' 2>/dev/null || true)"
              if [ -z "$port" ] && [ -f .env ]; then
                port="$(grep -E '^PORT=' .env | tail -n 1 | cut -d= -f2- | tr -d "\"' \r" || true)"
              fi
              echo "${port:-5000}"
            }

            # Живой = /api/health отвечает и отдаёт buildSha ожидаемой сборки.
            # 503 при недоступной БД — тоже живой процесс: откат кода БД не
            # починит, поэтому только предупреждаем. Ждём до ~90 с: сервер
            # начинает слушать порт только после старта Telegram-бота, а getMe
            # с РФ-хостинга бывает долгим — ложный откат хуже медленной проверки.
            wait_healthy() {
              local expected="$1" port body code
              port="$(app_port)"
              body="$(mktemp)"
              for _ in $(seq 1 45); do
                code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 3 "http://127.0.0.1:${port}/api/health" 2>/dev/null || true)"
                if grep -q "\"buildSha\":\"${expected}\"" "$body" 2>/dev/null; then
                  rm -f "$body"
                  [ "$code" = "200" ] || echo "WARNING: /api/health ответил ${code} (БД?), но процесс уже на сборке ${expected}"
                  return 0
                fi
                sleep 2
              done
              rm -f "$body"
              return 1
            }

            echo ">>> reload app"
            reload_app
            pm2 status

            echo ">>> health-check (порт $(app_port))"
            if wait_healthy "$NEW_SHA"; then
              echo ">>> прод на сборке $NEW_SHA"
            else
              echo "ERROR: сборка $NEW_SHA не ответила на /api/health за ~90 с — откат"
              if [ -d "$PREV_DIR" ]; then
                rm -rf dist
                mv "$PREV_DIR" dist
                if [ -n "$OLD_SHA" ]; then echo "$OLD_SHA" > .build-sha; else rm -f .build-sha; fi
                reload_app
                if [ -n "$OLD_SHA" ] && wait_healthy "$OLD_SHA"; then
                  echo ">>> откат выполнен: прод на прежней сборке $OLD_SHA"
                else
                  echo ">>> откат выполнен, но прежняя сборка не подтвердила здоровье — смотрите pm2 logs"
                fi
              else
                echo "Предыдущей сборки нет — откатывать нечего, смотрите pm2 logs"
              fi
              pm2 status
              exit 1
            fi

            echo ">>> ensure autostart cron"
            # У PM2 на этом сервере нет systemd-юнита: `pm2 startup` требует
            # root, которого у деплой-пользователя нет. Поэтому автозапуск
            # держим на пользовательском crontab. 08.08.2026 сервер
            # перезагрузился и прод пролежал ~2 суток именно из-за этого.
            #
            # Шаг идемпотентный: старые строки вычищаются по маркеру и
            # ставятся заново, так что crontab не растёт от деплоя к деплою.
            WD="$DEPLOY_PATH/script/pm2-watchdog.sh"
            chmod +x "$WD"
            {
              # || true: при pipefail пустой crontab (или только строки
              # watchdog) давал grep -v код 1 и валил весь деплой.
              crontab -l 2>/dev/null | grep -v 'pm2-watchdog.sh' || true
              echo "@reboot sleep 20 && /bin/sh $WD"
              echo "*/5 * * * * /bin/sh $WD"
            } | crontab -
            echo ">>> crontab теперь:"
            crontab -l | grep 'pm2-watchdog.sh'
