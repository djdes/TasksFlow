name: Uptime

# Внешний пинг прода каждые 15 минут: 08.08.2026 после перезагрузки сервера
# прод пролежал ~2 суток. Падение job'а = письмо от GitHub. Если заданы
# секреты ALERT_TELEGRAM_BOT_TOKEN и ALERT_TELEGRAM_CHAT_ID — ещё и сообщение
# в Telegram. Адрес можно переопределить переменной репозитория UPTIME_URL.
#
# GitHub отключает расписания в репозиториях без активности 60 дней —
# тогда workflow нужно включить заново во вкладке Actions.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UPTIME_URL: ${{ vars.UPTIME_URL || 'https://tasksflow.ru/api/health' }}
      ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
      ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}

    steps:
      - name: Check /api/health
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 15 "$UPTIME_URL")"
          echo "$body"
          # 200 без ok:true — тоже авария (например, чужая заглушка хостинга).
          echo "$body" | grep -q '"ok":true'

      - name: Alert to Telegram
        if: failure() && env.ALERT_TELEGRAM_BOT_TOKEN != '' && env.ALERT_TELEGRAM_CHAT_ID != ''
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -fsS --max-time 15 \
            "https://api.telegram.org/bot${ALERT_TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ALERT_TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔴 TasksFlow не отвечает: ${UPTIME_URL} — ${run_url}" \
            > /dev/null
