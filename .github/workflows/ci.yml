name: CI

# Проверки на каждый PR и push в рабочие ветки. main проверяет job test в
# deploy.yml перед выкаткой; там smoke не гоняем, чтобы не тормозить деплой.
on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Как на проде: сервер работает на Node 24 (nvm, v24.12) — см. DEPLOY.md.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for smoke
        run: npx playwright install --with-deps chromium

      - name: UI smoke
        run: npm run smoke

      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-output
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7
