<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5566f6" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope: дружелюбный, очень читаемый, с хорошей кириллицей —
         для публичной части (кабинет остаётся на своих шрифтах). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Anti-flash тема ДО рендера (тот же ключ, что в кабинете). -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme-preference');
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (s === 'dark' || ((s === 'system' || !s) && d)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
        // Scroll-reveal: прячем элементы до появления в зоне видимости.
        // Если бандл не активировал ревил за 3с (ошибка/медленная сеть) —
        // снимаем класс, и контент просто становится виден. Без JS этот
        // скрипт не выполнится → контент виден сразу.
        var de = document.documentElement;
        de.classList.add('reveal-ready');
        setTimeout(function () {
          if (!window.__revealActive) de.classList.remove('reveal-ready');
        }, 3000);
      })();
    </script>
    <!--app-head-->
    <style>
      /* SPA-кабинет фиксирует body (position:fixed; overflow:hidden) и
         скроллит контейнер #root — это ломало скролл колесом на публичных
         страницах, которые рендерятся в #public-root. Возвращаем обычный
         скролл документа. position:static — ключевое (без него body вне
         потока и страница не прокручивается). !important перебивает index.css. */
      html, body { height: auto !important; overflow: visible !important; position: static !important; }
      #public-root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="public-root"><!--app-html--></div>
    <!--app-data-->
    <script type="module" src="/src/public/entry-client.tsx"></script>
  </body>
</html>
