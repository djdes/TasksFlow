<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#5566f6" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Шрифты (Manrope, Onest) — свои, из бандла (client/src/fonts-public.css):
         без Google Fonts, IP посетителей никуда не передаётся. -->
    <!-- Anti-flash тема ДО рендера (тот же ключ, что в кабинете). -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme-preference');
          document.documentElement.dataset.motion = localStorage.getItem('tf_motion_enabled') === 'false' || window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full';
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (s === 'dark' || ((s === 'system' || !s) && d)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
        // Scroll-reveal: прячем элементы до появления в зоне видимости.
        // Если бандл не активировал ревил за 3с (ошибка/медленная сеть) —
        // снимаем класс, и контент просто становится виден. Без JS этот
        // скрипт не выполнится → контент виден сразу.
        var de = document.documentElement;
        de.classList.add('reveal-ready');
        setTimeout(function () {
          if (!window.__revealActive) de.classList.remove('reveal-ready');
        }, 3000);
      })();
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="public-root"><!--app-html--></div>
    <!--app-data-->
    <script type="module" src="/src/public/entry-client.tsx"></script>
  </body>
</html>
